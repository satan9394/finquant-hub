version: 2
updates:
  # Python backend. Minor/patch are grouped into one PR; major updates stay
  # as individual PRs so a breaking bump is reviewed on its own.
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      backend-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Frontend (pnpm). Same rule: group minor/patch, isolate majors.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      frontend-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Marketing/demo sites (pnpm). Same rule.
  - package-ecosystem: "npm"
    directory: "/sites"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      sites-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions. Same rule.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
