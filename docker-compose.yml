services:
  backend:
    build:
      context: .
      target: backend
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-deepseek-v4-flash}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
    ports:
      - "8000:8000"
    volumes:
      - finquant-data:/app/backend/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  finquant-data:
